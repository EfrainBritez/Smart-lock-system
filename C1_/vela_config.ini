; Configuracion de Vela para el Grove Vision AI V2 (Himax WiseEye2, Ethos-U55)
;
; AVISO: los valores que NO sean OffChipFlash_read/write_latency=64 los
; reconstrui por analogia con la config de ejemplo de Arm; solo esos dos los vi
; en la guia oficial de Seeed. Afectan UNICAMENTE la estimacion de tiempo y
; memoria que reporta Vela, no que capas van a la NPU. Cuando puedas,
; reemplaza este archivo por el vela_config.ini de la wiki de Seeed
; (secciones "Deploy YOLOv8").

[System_Config.My_Sys_Cfg]
core_clock=400e6
axi0_port=Sram
axi1_port=OffChipFlash
Sram_clock_scale=1.0
Sram_burst_length=32
Sram_read_latency=16
Sram_write_latency=16
OffChipFlash_clock_scale=0.0625
OffChipFlash_burst_length=128
OffChipFlash_read_latency=64
OffChipFlash_write_latency=64

; Pesos en flash (Axi1); tensores intermedios en SRAM (Axi0)
[Memory_Mode.My_Mem_Mode_Parent]
const_mem_area=Axi1
arena_mem_area=Axi0
cache_mem_area=Axi0
