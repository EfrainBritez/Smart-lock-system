; Configuracion OFICIAL de Vela para el Grove Vision AI V2 (Himax WiseEye2, Ethos-U55)
; Fuente: wiki de Seeed (Train and deploy the YOLOv8 object detection model),
; https://files.seeedstudio.com/sscma/configs/vela_config.ini
;
; System Configuration
[System_Config.My_Sys_Cfg]
core_clock=400e6
axi0_port=Sram
axi1_port=OffChipFlash
Sram_clock_scale=1.0
Sram_burst_length=32
Sram_read_latency=16
Sram_write_latency=16
Dram_clock_scale=0.75
Dram_burst_length=128
Dram_read_latency=500
Dram_write_latency=250
OnChipFlash_clock_scale=0.25
OffChipFlash_clock_scale=0.015625
OffChipFlash_burst_length=32
OffChipFlash_read_latency=64
OffChipFlash_write_latency=64

; Memory Mode: pesos en flash (Axi1); tensores intermedios y cache en SRAM (Axi0)
[Memory_Mode.My_Mem_Mode_Parent]
const_mem_area=Axi1
arena_mem_area=Axi0
cache_mem_area=Axi0